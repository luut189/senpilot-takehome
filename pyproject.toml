[project]
name = "senpilot"
version = "0.1.0"
description = "Nova Scotia regulatory document retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "playwright>=1.58,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16.1",
    "resend>=2.50.0",
    "svix>=2.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in regulatory website smoke tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
