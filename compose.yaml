services:
  agent:
    build: .
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/jobs.sqlite3
      TEMP_ROOT: /tmp/senpilot
      CHROMIUM_CHANNEL: chromium
      HEADLESS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jobs:/data
    tmpfs:
      - /tmp:size=536870912,mode=1777
    read_only: true
    shm_size: 256mb
    mem_limit: 2g
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  jobs:
